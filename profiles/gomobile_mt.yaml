version: 3
kind: carrier_bundle
id: apple_gomobile_mt
bundle: GoMobile_mt.bundle
supported_plmns:
    - "27821"
plmn_overrides:
    "27821":
        apns:
            - apn: gointernet
              type_mask: 49
              allowed_ip_stack: ipv4v6
              default_ip_stack: ipv4v6
              roaming_ip_stack: ipv4v6
        ims:
            volte:
                enable_volte_by_default: true
